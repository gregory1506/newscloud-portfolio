name: Verify offline portfolio

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies only
        run: python -m pip install --requirement requirements-dev.txt
      - name: Verify source provenance and documentation links
        run: python tools/verify_candidate.py
      - name: Exercise behavioral regressions
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q
      - name: Build without site packages
        run: python -S -m demo.build --output demo-output
